# A "Discord" output for cassette. Discord plays into it, it passes
# everything on to the normal output (so Discord sounds exactly as before),
# and cassette records only this sink (`output = discord_sink` in
# ~/.config/cassette/config), so games and music never end up in clips.
#
# Discord's Output Device in Voice & Video is set to "Discord". PipeWire reads
# this file when it starts, so changes take effect at the next login or after
# `systemctl --user restart pipewire pipewire-pulse wireplumber`.
#
# The pass-through side plays to the default output. EasyEffects picks it
# up like any other app, so output effects still apply. If the "Discord"
# device is missing when Discord starts, Discord falls back to Default and
# stays there until it is reselected.
context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Discord"
            capture.props = {
                node.name      = "discord_sink"
                media.class    = "Audio/Sink"
                audio.position = [ FL FR ]
            }
            playback.props = {
                # Passive: an idle Discord sink doesn't keep the real output
                # device awake on its own.
                node.name      = "discord_sink.output"
                node.passive   = true
                audio.position = [ FL FR ]
            }
        }
    }
]
