##### MODE LABEL #####
# Shows the first that applies: prefix pressed, copy mode, synchronized panes. When
# none do, it's a plain TMUX on the bar's own background.
%hidden mode_word="#{?client_prefix,WAIT,#{?pane_in_mode,COPY,#{?pane_synchronized,SYNC,TMUX}}}"
%hidden mode_bg="#{?client_prefix,$color_focus,#{?pane_in_mode,$color_info,#{?pane_synchronized,$color_attention,default}}}"
%hidden mode_fg="#{?#{==:$mode_word,TMUX},$color_muted,$color_on_accent}"

##### STATUS BAR OPTIONS #####
set -g status on
set -g status-justify absolute-centre                         # center on the whole bar, so a mode label can't shift the list
set -g status-position bottom
set -g status-left-length 90
set -g status-right-length 90
set -g status-style                  "bg=$color_raised,fg=$color_muted"
set -g status-left                   "#[fg=$mode_fg,bg=$mode_bg,bold] $mode_word #[default]"
set -g status-right                  "#[fg=$color_muted]#S   #[fg=$color_fg_dim]%-I:%M %p "
setw -g window-status-separator      ""
setw -g window-status-current-style  default                  # tmux underlines it otherwise
setw -g window-status-bell-style     default                  # tmux reverses it otherwise
setw -g window-status-format         "#[fg=#{?window_bell_flag,$color_attention,$color_muted}] #I #W  "
setw -g window-status-current-format "#[fg=$color_focus] #I #[fg=$color_fg,bold]#W#[nobold]#{?window_zoomed_flag, 󰁌,}  "

##### PANES #####
set -g pane-active-border-style      "fg=$color_focus"
set -g pane-border-style             "fg=$color_border"
set -g display-panes-colour          "$color_muted"
set -g display-panes-active-colour   "$color_focus"
setw -g clock-mode-colour            "$color_focus"

##### MESSAGES #####
set -g message-style                 "bg=$color_focus,fg=$color_on_accent"
set -g message-command-style         "bg=$color_raised,fg=$color_focus"

##### COPY MODE #####
setw -g mode-style                   "bg=$color_selection"
setw -g copy-mode-match-style        "bg=$color_raised,fg=$color_attention"
setw -g copy-mode-current-match-style "bg=$color_attention,fg=$color_on_accent"
setw -g copy-mode-mark-style         "bg=$color_focus,fg=$color_on_accent"
setw -g copy-mode-position-style     "bg=$color_raised,fg=$color_fg_dim"

##### POPUPS & MENUS #####
# tmux 3.8 themes these via detected light/dark; ghostty misreports light, so pin it
set -s theme dark
set -g popup-style                   "default"
set -g popup-border-style            "fg=$color_focus"        # match active pane border
set -g popup-border-lines            rounded
set -g menu-style                    "bg=$color_raised,fg=$color_fg_dim"
set -g menu-selected-style           "bg=$color_focus,fg=$color_on_accent"
set -g menu-border-style             "fg=$color_focus"
set -g menu-border-lines             rounded
