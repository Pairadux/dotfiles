# Topgrade Configuration
# See: https://github.com/topgrade-rs/topgrade/wiki
# Example config: https://github.com/topgrade-rs/topgrade/blob/main/config.example.toml

[misc]
# Run `sudo -v` to cache credentials at the start of the run
# This avoids a blocking password prompt in the middle of an unattended run
# (default: false)
pre_sudo = true

# Disable specific steps - same options as the command line flag
disable = ["gcloud", "self_update"]

# Display the time in step titles (default: true)
display_time = true

# Don't ask for confirmations (no default value)
assume_yes = true

# Cleanup temporary or old files after updates
cleanup = true



[linux]
## Arch Package Manager to use.
# Allowed values:
#   autodetect, aura, garuda_update, pacman, pamac, paru, pikaur, trizen, yay
arch_package_manager = "yay"

# Show Arch news before updating (recommended!)
show_arch_news = true



[git]
# Max number of git repos to update in parallel
max_concurrency = 5



[npm]
# Use sudo if NPM directory isn't owned by current user
# Usually not needed if using nvm
use_sudo = false



[flatpak]
# Use sudo for system-wide flatpak updates
use_sudo = true



[pre_commands]
# Dart tooling rewrites the SDK's own pubspec.lock when it re-resolves deps.
# `flutter upgrade` hard-resets and refuses on a dirty tree, so drop that
# generated churn before the flutter step runs.
"Reset Flutter SDK lockfile" = "git -C /home/austincgause/.local/share/flutter-sdk cat-file -e HEAD:pubspec.lock && { git -C /home/austincgause/.local/share/flutter-sdk diff --quiet -- pubspec.lock && git -C /home/austincgause/.local/share/flutter-sdk diff --cached --quiet -- pubspec.lock; } || git -C /home/austincgause/.local/share/flutter-sdk restore pubspec.lock; true"



[commands]
# Skips itself unless the last backup is older than 20h, so a re-run of topgrade
# on the same day costs only a remote listing. Invoked by name rather than by
# path so it survives ~/.bin moving again.
"Zen profile backup" = "zen-backup"

"Mason Update" = "nvim --headless -c \"lua vim.notify = function(msg) io.stderr:write(msg .. '\\n') end; require('lazy').load({plugins = {'nvim-lspconfig'}})\" -c MasonToolsUpdateSync -c quitall"
