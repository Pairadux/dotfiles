# Generated by chezmoi from .chezmoidata/theme.toml and overwritten on every apply.
# GTK reads these under X11. Under Wayland most of them come from gsettings instead.
[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-icon-theme-name={{ .theme.icons.name }}
gtk-font-name={{ .theme.font.sans }} 11
gtk-cursor-theme-name={{ .theme.cursor.name }}
gtk-cursor-theme-size={{ .theme.cursor.size }}
gtk-application-prefer-dark-theme=1
gtk-decoration-layout=:close
