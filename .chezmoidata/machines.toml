# Machine inventory — the single place a host's hardware facts are declared.
#
# Consumers branch on the *capabilities* described here (is there more than one
# display, is this a laptop, does it want a VA-API driver, does it run
# gametrak), not on `.chezmoi.hostname`, so a new machine is one
# `[machines.<hostname>]` block and no other edits.
#
# The derivation of those capabilities lives in ONE place,
# .chezmoitemplates/machine, which returns them as JSON:
#
#   {{ $m := includeTemplate "machine" . | fromJson }}
#
# Most consumers are not templates at all. hyprland.lua and the hypr scripts are
# plain lua and bash that read the generated machine.lua / scripts/machine.sh
# and branch at runtime, so they keep their own syntax highlighting and tooling.
#
# --override-data previews another host's facts:
#
#   chezmoi execute-template --override-data '{"chezmoi":{"hostname":"fuji"}}' \
#     '{{ includeTemplate "machine" . }}'
#
# An unrecognised host silently falls back to [fallback] below. This reports
# which one applies:
#
#   chezmoi execute-template \
#     '{{ if hasKey .machines .chezmoi.hostname }}known{{ else }}FALLBACK{{ end }}'
#
# ---------------------------------------------------------------------------
# Per-machine keys
# ---------------------------------------------------------------------------
#   arch          informational only. Arch Linux ARM carries far less than
#                 Arch, so x86_64 packages may not exist on other architectures.
#   laptop        true enables battery/backlight/touchpad-oriented config.
#   vaapi_driver  value for LIBVA_DRIVER_NAME. Absent leaves the variable unset,
#                 which is correct without a discrete GPU whose driver needs
#                 forcing.
#   autostart     ordered list of keys into [autostart_commands] below. Order
#                 is the exec order, so `dbus` stays first.
#   wallpaper_dir wallpaper library, relative to $HOME. The picker expects a
#                 <name>/ folder per wallpaper; see the wallpaper picker for the
#                 slice layout a multi-monitor machine needs.
#   monitors      ordered list of displays; see the monitor keys below.
#   effects       which [theme.effects] set applies: "full" or "lean".
#   kana          the hostname in kana, shown on the bar and lock screen.
#   neighbors     the kana on either side of this machine on the lock screen.
#                 The three hosts form a loop, so each has the other two.
#   lock_scale    lock screen size against a display 2560 wide, from the
#                 primary display's logical width. Absent means 0.75.
#
# Monitor keys
#   output     connector name as reported by `hyprctl monitors`.
#   mode       "WIDTHxHEIGHT[@REFRESH]", or "preferred" to let Hyprland pick.
#   position   "XxY", or "auto".
#   scale      number.
#   transform  optional Hyprland transform (1 = 90°, 2 = 180°, 3 = 270°).
#              Omit for a normally-oriented display.
#   role       optional, "primary" or "secondary". Workspace pinning and the
#              monitor= field on window rules are only emitted when a machine
#              declares BOTH roles — that is the "has a multi-monitor layout"
#              capability. A single-display machine declares only "primary".
#   note       optional; carried into machine.lua as a reminder for whoever
#              reads the generated facts. Nothing renders it.

# ---------------------------------------------------------------------------
# Shared autostart command table. Machines reference these by key so the same
# command is never spelled out twice.
#
# A key that also names a program local in hyprland.lua's PROGRAMS section is
# looked up there first (see `autostartLocals`), so the local stays the single
# definition of the command and the two cannot drift.
# ---------------------------------------------------------------------------
[autostart_commands]
dbus            = "dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP"
lockscreen      = "hyprlock"
nm-applet       = "nm-applet"
dunst           = "systemctl --user start dunst.service"
hyprpaper       = "hyprpaper"
waybar          = "waybar"
cliphist-text   = "wl-paste --type text --watch cliphist store"
cliphist-image  = "wl-paste --type image --watch cliphist store"
hyprpolkitagent = "systemctl --user start hyprpolkitagent"
mega-status     = "systemctl --user start mega-status"
gametrak        = "systemctl --user start gametrak"
cassette-tray   = "systemctl --user start cassette-tray"
sunshine        = "systemctl --user start app-dev.lizardbyte.app.Sunshine"
hypridle        = "hypridle"
# GSR's own startup option now writes an XDG autostart entry, which nothing in
# this session runs, so it is started here instead.
gsr-ui          = "flatpak run com.dec05eba.gpu_screen_recorder gsr-ui"

# ---------------------------------------------------------------------------
# mutsu — x86_64 desktop, AMD GPU, three displays.
# ---------------------------------------------------------------------------
[machines.mutsu]
arch          = "x86_64"
laptop        = false
vaapi_driver  = "radeonsi"
wallpaper_dir = "Pictures/wallpapers"
effects       = "full"
kana          = "むつ"
neighbors     = ["ふじ", "ほくと"]
lock_scale    = 1.0
autostart = [
    "dbus",
    "lockscreen",
    "nm-applet",
    "dunst",
    "hyprpaper",
    "waybar",
    "cliphist-text",
    "cliphist-image",
    "hyprpolkitagent",
    "mega-status",
    "cassette-tray",
    "gametrak",
    "sunshine",
    "gsr-ui",
]

[[machines.mutsu.monitors]]
output   = "DP-2"
mode     = "2560x1440@144"
position = "0x0"
scale    = 1
role     = "primary"

[[machines.mutsu.monitors]]
output    = "HDMI-A-1"
mode      = "1920x1080"
position  = "320x-1080"
scale     = 1
transform = 2
role      = "secondary"

[[machines.mutsu.monitors]]
output    = "HDMI-A-2"
mode      = "1920x1080"
position  = "-720x0"
scale     = 1.5
transform = 1
note      = "TEMP VERTICAL MONITOR"

# ---------------------------------------------------------------------------
# fuji — Apple M2 MacBook Air on Asahi Alarm (Arch Linux ARM, aarch64).
#
# Asahi cannot drive external displays, so this host is permanently
# single-head: only a "primary" role is declared, which switches off workspace
# pinning, per-window monitor= fields and the split wallpaper path everywhere.
#
# gametrak and mega-status are not packaged/needed, and the session does not
# lock on start.
# ---------------------------------------------------------------------------
[machines.fuji]
arch          = "aarch64"
laptop        = true
wallpaper_dir = "Pictures/wallpapers"
effects       = "lean"
kana          = "ふじ"
neighbors     = ["ほくと", "むつ"]
lock_scale    = 0.6
# vaapi_driver deliberately unset: Asahi's GPU stack needs no LIBVA override,
# and radeonsi would be actively wrong here.
autostart = [
    "dbus",
    "lockscreen",
    "nm-applet",
    "dunst",
    "hyprpaper",
    "waybar",
    "cliphist-text",
    "cliphist-image",
    "hyprpolkitagent",
    "hypridle",
]

[[machines.fuji.monitors]]
output   = "eDP-1"
mode     = "preferred"
position = "0x0"
scale    = 1.67
role     = "primary"

# ---------------------------------------------------------------------------
# Fallback for a host with no block above: a conservative single-display
# session that comes up usable, rather than a template error or a blank
# screen. The hasKey check at the top of this file reports when it is in use.
# ---------------------------------------------------------------------------
[fallback]
arch          = "unknown"
laptop        = false
wallpaper_dir = "Pictures/wallpapers"
effects       = "lean"
autostart = [
    "dbus",
    "nm-applet",
    "dunst",
    "hyprpaper",
    "waybar",
    "cliphist-text",
    "cliphist-image",
    "hyprpolkitagent",
]

[[fallback.monitors]]
output   = ""
mode     = "preferred"
position = "auto"
scale    = 1
role     = "primary"
note     = "catch-all: empty output matches every connected display"
